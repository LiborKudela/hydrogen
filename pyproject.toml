[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogen"
version = "0.1.0"
description = "Symbolic DAE/ODE solver for fluid-system dynamics."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "CoolProp>=6.5",
    "numba>=0.58",
    "scipy>=1.10",
    "sympy>=1.12",
    "line_profiler",
    "plotly",
    "PySide6>=6.5",
]

[project.scripts]
hydrogen-ui = "hydrogen.ui.app:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
examples = ["matplotlib>=3.7"]  # plotting dep for the tutorials/ + benchmarks/ scripts
mpi = ["mpi4py>=3.1"]
# Optional feos-backed medium (FeosMedium). CoolProp remains the default
# backend, so these are only needed when a project selects provider="feos".
feos = ["feos>=0.9", "si-units>=0.11"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["hydrogen*"]
exclude = ["tutorials*", "benchmarks*", "tests*"]

[tool.setuptools.package-data]
"hydrogen.components.icons" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exclude the (slow) end-to-end tutorial + benchmark runs from the default
# suite; opt in with `pytest -m tutorials` / `pytest -m benchmarks` when you
# want to verify those scripts still run and produce correct results.
addopts = "-q -m 'not tutorials and not benchmarks'"
markers = [
    "tutorials: end-to-end tutorial scripts (deselected by default; run with -m tutorials)",
    "benchmarks: scaling / speed / analytical-correctness benchmark scripts (deselected by default; run with -m benchmarks)",
    "slow: long-running cases (e.g. the benchmark scripts)",
]
