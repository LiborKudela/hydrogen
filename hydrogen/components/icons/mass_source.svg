<?xml version="1.0" encoding="UTF-8"?>
<!-- P&ID-style mass-flow source: a reservoir (circle marked "m") feeding out to
     the right, with a double arrow denoting an imposed mass flow rate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" fill="none"
     stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"
     stroke-linejoin="round">
  <!-- reservoir -->
  <circle cx="40" cy="30" r="20"/>
  <text x="40" y="38" font-family="sans-serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#1b1b1b" stroke="none">m&#775;</text>
  <!-- supply line + double arrowhead toward the outlet (imposed flow) -->
  <line x1="60" y1="30" x2="118" y2="30"/>
  <polyline points="90,23 100,30 90,37"/>
  <polyline points="102,23 112,30 102,37"/>
</svg>
